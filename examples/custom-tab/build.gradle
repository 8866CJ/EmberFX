// A team module for FRC Dashboard. Build it with the dashboard's Gradle wrapper:
//   gradlew.bat -p examples\custom-tab jar      (from the repo root)
// then copy build\custom-tab\libs\custom-tab.jar into %USERPROFILE%\.frcdash\modules\ and reopen the dashboard.
plugins {
    id "java"
}

// The dashboard jar provides the module API, NetworkTables, JavaFX and Jackson at runtime.
// Point at the jar inside the app folder (FRCDashboard\app\FRCDashboard.jar) or the repo build.
def dashboardJar = findProperty('dashboardJar') ?: '../../build/libs/FRCDashboard.jar'

// Output goes under the repo's build\ folder, which git already ignores.
layout.buildDirectory = file('../../build/custom-tab')

dependencies {
    compileOnly files(dashboardJar)
}

tasks.withType(JavaCompile) {
    options.release = 17
}
