# Push a tag like v1.2.0 to publish a release:
#   git tag v1.2.0
#   git push origin v1.2.0
#
# Assets keep the same names in every release, so these links always point at the newest one:
#   https://github.com/8866CJ/FRCDashboard/releases/latest/download/FRCDashboard-Setup.exe
#   https://github.com/8866CJ/FRCDashboard/releases/latest/download/FRCDashboard-Portable.zip
#   https://github.com/8866CJ/FRCDashboard/releases/latest/download/install.ps1
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: # re-run by hand from the Actions tab (builds without publishing unless run on a tag)

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install Inno Setup and put its compiler on PATH
        run: |
          $iscc = Get-ChildItem 'C:\Program Files (x86)\Inno Setup*', 'C:\Program Files\Inno Setup*' -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = Get-ChildItem 'C:\Program Files (x86)\Inno Setup*', 'C:\Program Files\Inno Setup*' -Filter ISCC.exe -Recurse | Select-Object -First 1
          }
          if (-not $iscc) { throw 'Inno Setup was installed but ISCC.exe was not found.' }
          Write-Host "Using $($iscc.FullName)"
          $iscc.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build installer and portable zip
        run: |
          $version = if ("${{ github.ref_type }}" -eq 'tag') { "${{ github.ref_name }}".TrimStart('v') } else { '0.0.0' }
          ./gradlew.bat test packageInstaller "-PappVersion=$version" --no-daemon
          if ($LASTEXITCODE -ne 0) {
            Get-ChildItem build/dist/FRCDashboard -ErrorAction SilentlyContinue | Format-Table Name, Length
            throw "Gradle failed (exit $LASTEXITCODE). The error is under 'What went wrong' above."
          }
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item "build/installer/FRCDashboard-Setup-$version.exe" release/FRCDashboard-Setup.exe
          Copy-Item build/dist/FRCDashboard.zip release/FRCDashboard-Portable.zip
          # install.ps1 downloads from this repo's latest release.
          (Get-Content scripts/install.ps1 -Raw).Replace('__REPO__', '${{ github.repository }}') | Set-Content release/install.ps1

      - name: Keep the build as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: FRCDashboard
          path: release/*

      - name: Publish the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
