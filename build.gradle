plugins {
    id 'java'
    id 'edu.wpi.first.GradleRIO' version '2026.2.1'
}

// GradleRIO is used only for the WPILib libraries (ntcore, wpiutil) and their desktop natives.
// Nothing here deploys to a roboRIO.
//
// Tasks:
//   gradlew runJavaFX         run from source
//   gradlew test              unit tests
//   gradlew packageExe        build/dist/FRCDashboard/ (app with its own Java) and build/dist/FRCDashboard.zip
//   gradlew packageInstaller  build/installer/FRCDashboard-Setup-<version>.exe (needs Inno Setup 6)

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

def appName = 'FRCDashboard'
def mainClass = 'frcdash.app.Launcher'
// Release builds pass -PappVersion=1.2.3 (from the git tag v1.2.3). jpackage needs plain numbers.
def appVersion = findProperty('appVersion') ?: '0.0.0'

def javafxVersion = '17.0.2'
def javafxModules = ['javafx.base', 'javafx.controls', 'javafx.graphics']
def osName = System.getProperty('os.name').toLowerCase()
def isWindows = osName.contains('win')
def javafxPlatform = isWindows ? 'win' : osName.contains('mac') ? 'mac' : 'linux'

wpi.java.debugJni = false

dependencies {
    implementation wpi.java.deps.wpilib()
    nativeDebug wpi.java.deps.wpilibJniDebug(wpi.platforms.desktop)
    nativeRelease wpi.java.deps.wpilibJniRelease(wpi.platforms.desktop)

    javafxModules.each { module ->
        implementation "org.openjfx:${module.replace('.', '-')}:${javafxVersion}:${javafxPlatform}"
    }

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add '-XDstringConcat=inline'
}

test {
    useJUnitPlatform()
}
wpi.java.configureTestTasks(test)

// Fat jar: the app plus every library. Team modules compile against this jar (compileOnly).
jar {
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'module-info.class'
    manifest { attributes 'Main-Class': mainClass }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

/** Gradle services for running programs and copying files inside task actions. */
interface BuildServices {
    @javax.inject.Inject ExecOperations getExec()
    @javax.inject.Inject FileSystemOperations getFiles()
}
def services = objects.newInstance(BuildServices)

def javafxModulePath = {
    configurations.runtimeClasspath.filter { it.name.startsWith('javafx-') && it.name.endsWith("-${javafxPlatform}.jar") }.asPath
}

// ---- run from source ----

tasks.register('runJavaFX', JavaExec) {
    group = 'application'
    description = 'Runs the dashboard from source'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'frcdash.app.MainApp'
    def natives = wpi.java.getExtractNativeReleaseArtifacts()
    dependsOn natives
    doFirst {
        def nativePath = natives.get().destinationDirectory.get().asFile.absolutePath
        if (isWindows) environment 'PATH', (System.getenv('PATH') ?: '') + File.pathSeparator + nativePath
        else environment 'LD_LIBRARY_PATH', nativePath
        systemProperty 'java.library.path', nativePath
        jvmArgs '--module-path', javafxModulePath(), '--add-modules', javafxModules.join(',')
    }
}

tasks.register('printJavaFXPath') {
    group = 'help'
    description = 'Prints the JVM arguments for running frcdash.app.MainApp from an IDE'
    doLast {
        logger.lifecycle("--module-path \"${javafxModulePath().replace('\\', '/')}\" --add-modules ${javafxModules.join(',')}")
    }
}

// ---- packaging (Windows) ----

def distDir = layout.buildDirectory.dir('dist')
def appImageDir = layout.buildDirectory.dir("dist/${appName}")

// The app folder: FRCDashboard.exe with its own Java runtime, the WPILib DLLs it needs, and the helper scripts.
def appImage = tasks.register('appImage') {
    group = 'distribution'
    description = 'Builds build/dist/FRCDashboard/ with jpackage'
    def natives = wpi.java.getExtractNativeReleaseArtifacts()
    dependsOn jar, natives
    doLast {
        def input = layout.buildDirectory.dir('jpackage-input').get().asFile
        def dist = distDir.get().asFile
        services.files.delete { delete input, dist }
        services.files.copy { from jar.archiveFile; into input }

        def jpackage = new File(System.getProperty('java.home'), 'bin/jpackage' + (isWindows ? '.exe' : ''))
        if (!jpackage.exists()) {
            throw new GradleException("No jpackage at ${jpackage}. Run with JAVA_HOME set to a full JDK 17+, " +
                "such as the WPILib JDK in C:\\Users\\Public\\wpilib\\<year>\\jdk.")
        }
        services.exec.exec {
            commandLine jpackage, '--type', 'app-image',
                '--name', appName, '--app-version', appVersion,
                '--input', input, '--main-jar', jar.archiveFileName.get(), '--main-class', mainClass,
                '--dest', dist,
                // The WPILib DLLs sit next to the .exe, where Windows also finds their dependencies.
                '--java-options', '-Djava.library.path=$APPDIR\\..'
        }

        def image = appImageDir.get().asFile
        services.files.copy {
            // Only NetworkTables and what it links to; the rest of WPILib (OpenCV, HAL) isn't used.
            from(natives.get().destinationDirectory) {
                include '**/ntcore*.dll', '**/wpinet*.dll', '**/wpiutil*.dll'
                eachFile { it.path = it.name }
            }
            into image
            includeEmptyDirs = false
        }
        services.files.copy { from 'scripts'; include 'register-ds.*', 'reset-config.bat'; into image }
        services.files.copy { from 'README.md', 'PROJECT_OVERVIEW.md', 'MODULES.md'; into image }
    }
}

// The app folder as a portable zip. Running this also builds the folder.
tasks.register('packageExe', Zip) {
    group = 'distribution'
    description = 'Builds the app folder and build/dist/FRCDashboard.zip'
    dependsOn appImage
    from(distDir) { include "${appName}/**" }
    destinationDirectory = distDir
    archiveFileName = "${appName}.zip"
}

// One-file installer made with Inno Setup from installer/FRCDashboard.iss.
tasks.register('packageInstaller') {
    group = 'distribution'
    description = 'Builds build/installer/FRCDashboard-Setup-<version>.exe'
    dependsOn 'packageExe'
    doLast {
        def iscc = ((System.getenv('PATH') ?: '').split(File.pathSeparator).collect { new File(it, 'ISCC.exe') } + [
            new File(System.getenv('LOCALAPPDATA') ?: '', 'Programs/Inno Setup 6/ISCC.exe'),
            new File(System.getenv('ProgramFiles(x86)') ?: '', 'Inno Setup 6/ISCC.exe')]).find { it.exists() }
        if (iscc == null) {
            throw new GradleException('Making the installer needs Inno Setup 6. Install it with:\n' +
                '  winget install JRSoftware.InnoSetup --scope user\nthen run this again.')
        }
        def out = layout.buildDirectory.dir('installer').get().asFile
        services.files.delete { delete out }
        services.exec.exec {
            commandLine iscc, '/Q', "/DAppVersion=${appVersion}", "/DSourceDir=${appImageDir.get().asFile}",
                "/O${out}", file('installer/FRCDashboard.iss')
        }
        logger.lifecycle("Built ${new File(out, "${appName}-Setup-${appVersion}.exe")}")
    }
}
