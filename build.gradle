plugins {
    id "java"
    id "edu.wpi.first.GradleRIO" version "2026.2.1"
}

// GradleRIO is used only for the WPILib libraries (ntcore, wpiutil) and their desktop natives.
// Nothing here deploys to a roboRIO.

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

def MAIN_CLASS = "frcdash.Launcher"
def APP_NAME = "FRCDashboard"
// Release builds pass -PappVersion=1.2.3 (taken from the git tag v1.2.3).
def APP_VERSION = findProperty("appVersion") ?: "0.0.0" // jpackage needs plain numbers

wpi.java.debugJni = false

def javafxVersion = '17.0.2'
def osName = System.getProperty('os.name').toLowerCase()
def platform = osName.contains('win') ? 'win' : osName.contains('mac') ? 'mac' : 'linux'
def javafxModules = ['javafx.base', 'javafx.controls', 'javafx.fxml', 'javafx.graphics']

dependencies {
    implementation wpi.java.deps.wpilib()
    nativeDebug wpi.java.deps.wpilibJniDebug(wpi.platforms.desktop)
    nativeRelease wpi.java.deps.wpilibJniRelease(wpi.platforms.desktop)

    implementation "org.openjfx:javafx-base:${javafxVersion}:${platform}"
    implementation "org.openjfx:javafx-controls:${javafxVersion}:${platform}"
    implementation "org.openjfx:javafx-fxml:${javafxVersion}:${platform}"
    implementation "org.openjfx:javafx-graphics:${javafxVersion}:${platform}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}
wpi.java.configureTestTasks(test)

// Fat jar: the app plus every library. Team modules compile against this jar (compileOnly).
jar {
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'module-info.class'
    manifest { attributes 'Main-Class': MAIN_CLASS }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(JavaCompile) {
    options.compilerArgs.add '-XDstringConcat=inline'
}

def nativeExtract = { -> wpi.java.getDebugJni().getOrElse(false) ?
    wpi.java.getExtractNativeDebugArtifacts() : wpi.java.getExtractNativeReleaseArtifacts() }

def getJavafxModulePath = {
    def suffix = "-${platform}.jar"
    def jars = configurations.runtimeClasspath.filter { it.name.contains('javafx-') && it.name.endsWith(suffix) }
    return jars.isEmpty() ? null : jars.files.join(File.pathSeparator)
}

// .\gradlew.bat runJavaFX : run from source.
task runJavaFX(type: JavaExec) {
    group = 'application'
    description = 'Runs the dashboard from source'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'frcdash.MainApp'
    def extractTask = nativeExtract()
    dependsOn extractTask
    doFirst {
        def nativePath = extractTask.get().destinationDirectory.get().asFile.absolutePath
        if (osName.contains('win')) {
            environment 'PATH', (System.getenv('PATH') ?: '') + File.pathSeparator + nativePath
        } else {
            environment 'LD_LIBRARY_PATH', nativePath
            environment 'DYLD_FALLBACK_LIBRARY_PATH', nativePath
            environment 'DYLD_LIBRARY_PATH', nativePath
        }
        systemProperty 'java.library.path', nativePath
        def modulePath = getJavafxModulePath()
        if (modulePath != null) {
            jvmArgs += ['--module-path', modulePath, '--add-modules', javafxModules.join(',')]
        }
    }
}

// .\gradlew.bat packageExe : build/dist/FRCDashboard/FRCDashboard.exe with its own Java runtime,
// zipped to build/dist/FRCDashboard.zip. Needs a JDK with jpackage (the WPILib JDK has one).
task packageExe {
    group = 'distribution'
    description = 'Builds a self-contained Windows app folder and zip with jpackage'
    def extractTask = wpi.java.getExtractNativeReleaseArtifacts()
    dependsOn jar, extractTask
    doLast {
        def input = layout.buildDirectory.dir('jpackage-input').get().asFile
        def dist = layout.buildDirectory.dir('dist').get().asFile
        project.delete(input, dist)
        project.copy { from jar.archiveFile; into input }

        def jpackage = new File(System.getProperty('java.home'), 'bin/jpackage' + (osName.contains('win') ? '.exe' : ''))
        if (!jpackage.exists()) throw new GradleException("No jpackage at ${jpackage}. Run with JAVA_HOME set to a full JDK 17+ (the WPILib JDK, C:\\Users\\Public\\wpilib\\<year>\\jdk).")
        project.exec {
            commandLine jpackage, '--type', 'app-image',
                '--name', APP_NAME, '--app-version', APP_VERSION,
                '--input', input, '--main-jar', jar.archiveFileName.get(), '--main-class', MAIN_CLASS,
                '--dest', dist,
                // WPILib DLLs sit next to the .exe, where Windows also finds their dependencies.
                '--java-options', '-Djava.library.path=$APPDIR\\..'
        }

        def image = new File(dist, APP_NAME)
        project.copy {
            // Only NetworkTables and what it links to; the rest of WPILib (OpenCV, HAL) isn't used.
            from(extractTask.get().destinationDirectory) {
                include '**/ntcore*.dll', '**/wpinet*.dll', '**/wpiutil*.dll'
                eachFile { it.path = it.name }
            }
            into image
            includeEmptyDirs = false
        }
        project.copy { from 'scripts'; include 'register-ds.*', 'reset-config.bat'; into image }
        project.copy { from "MODULES.md", "README.md", "PROJECT_OVERVIEW.md"; into image }
        ant.zip(destfile: new File(dist, "${APP_NAME}.zip"), basedir: dist, includes: "${APP_NAME}/**")
        println "Built ${image}\\${APP_NAME}.exe and ${dist}\\${APP_NAME}.zip"
    }
}

// .\gradlew.bat packageInstaller : build/installer/FRCDashboard-Setup-<version>.exe, one file that installs the app
// (with its own Java), adds Start menu and desktop shortcuts, and registers an uninstaller. See installer/FRCDashboard.iss.
// Needs Inno Setup 6 (winget install JRSoftware.InnoSetup --scope user).
task packageInstaller {
    group = 'distribution'
    description = 'Builds a single-file Windows installer from the app folder'
    dependsOn packageExe
    doLast {
        def candidates = System.getenv('PATH').split(File.pathSeparator).collect { new File(it, 'ISCC.exe') } + [
            new File(System.getenv('LOCALAPPDATA') ?: '', 'Programs/Inno Setup 6/ISCC.exe'),
            new File(System.getenv('ProgramFiles(x86)') ?: '', 'Inno Setup 6/ISCC.exe')]
        def iscc = candidates.find { it.exists() }
        if (iscc == null) {
            throw new GradleException("Making the installer needs Inno Setup 6. Install it with:\n" +
                "  winget install JRSoftware.InnoSetup --scope user\nthen run this again.")
        }
        def out = layout.buildDirectory.dir('installer').get().asFile
        project.delete(out)
        project.exec {
            commandLine iscc, '/Q', "/DAppVersion=${APP_VERSION}",
                "/DSourceDir=${layout.buildDirectory.dir("dist/${APP_NAME}").get().asFile}",
                "/O${out}", file('installer/FRCDashboard.iss')
        }
        println "Built " + new File(out, "${APP_NAME}-Setup-${APP_VERSION}.exe")
    }
}

// Prints JavaFX VM arguments for running MainApp from an IDE.
task printJavaFXPath {
    group = 'help'
    description = 'Prints JavaFX JAR paths for IDE VM arguments'
    doLast {
        def modulePath = getJavafxModulePath()
        if (modulePath != null) {
            println "--module-path \"${modulePath.replace('\\', '/')}\" --add-modules ${javafxModules.join(',')}"
        } else {
            println "JavaFX JARs not found. Run 'gradlew build' first."
        }
    }
}
